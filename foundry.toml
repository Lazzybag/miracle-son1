[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"

# Re-mapping to ensure forge-std routes smoothly inside GitHub Actions
remappings = [
    "forge-std/=lib/forge-std/src/"
]

# Use Alchemy's high-uptime public gateway for Sepolia
[rpc_endpoints]
sepolia = "https://alchemy.com"
